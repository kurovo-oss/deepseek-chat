[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafeiyu"
dynamic = ["version"]
description = "把 DeepSeek 接进 QQ 私聊的个人陪伴机器人：长期记忆、固定人格、主动消息"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "luowenjie" }]
keywords = ["qq", "onebot", "chatbot", "deepseek", "companion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
# 运行时零第三方依赖：只用标准库。详见 AGENTS.md §2。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
dafeiyu = "qqbot.main:main"

[project.urls]
Documentation = "https://github.com/luowenjie/dafeiyu#readme"
Issues = "https://github.com/luowenjie/dafeiyu/issues"

[tool.setuptools.packages.find]
include = ["qqbot*"]

[tool.setuptools.package-data]
qqbot = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/assets/*"]

[tool.setuptools.dynamic]
version = { attr = "qqbot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    "data",
    "logs",
    "backups",
    "build",
    "dist",
    "tools",
    ".venv",
    "__pycache__",
    ".pytest_cache",
]
